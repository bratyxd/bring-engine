name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      prev_tag: ${{ steps.classify.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect if release has code changes since previous tag
        id: classify
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          is_non_code_file() {
            case "$1" in
              *.md|*.MD|docs/*|.github/*|.gitignore|LICENSE) return 0 ;;
              *) return 1 ;;
            esac
          }

          DOCS_ONLY="false"
          PREV_TAG=""

          if [ "$REF_TYPE" = "tag" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${REF_NAME}~1" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              mapfile -t CHANGED < <(git -c core.quotepath=false diff --name-only "${PREV_TAG}..HEAD")
              echo "Changed files since ${PREV_TAG}:"
              if [ "${#CHANGED[@]}" -gt 0 ]; then
                printf '  %s\n' "${CHANGED[@]}"
                HAS_CODE="false"
                for f in "${CHANGED[@]}"; do
                  if ! is_non_code_file "$f"; then
                    HAS_CODE="true"
                    break
                  fi
                done
                if [ "$HAS_CODE" = "false" ]; then
                  DOCS_ONLY="true"
                fi
              else
                DOCS_ONLY="true"
              fi
            fi
          fi

          echo "docs_only=${DOCS_ONLY}" | tee -a "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" | tee -a "$GITHUB_OUTPUT"

  test-windows:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify EngineInfo.Version matches tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag.TrimStart('v')
          $content = Get-Content -Raw src/BringEngine/EngineInfo.cs
          if ($content -notmatch "Version\s*=\s*`"$([regex]::Escape($expected))`"") {
            throw "EngineInfo.Version does not match tag $tag (expected '$expected')."
          }
      - name: Build solution & run full CoreCLR test suite (WARP D3D12 + Headless)
        shell: pwsh
        run: |
          dotnet build BringEngine.sln -c Release
          dotnet ./tests/BringEngine.Tests/bin/Release/net10.0/BringEngine.Tests.dll
          dotnet publish src/ShowcaseGame/ShowcaseGame.csproj -c Release -r win-x64
          $exe = "./src/ShowcaseGame/bin/Release/net10.0/win-x64/publish/ShowcaseGame.exe"
          & $exe --headless --ticks 600
          & $exe --verify-render --out build/verify-release-win

  test-linux:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install SDL3 runtime, fonts & software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 \
            fonts-dejavu-core libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxss1 libxtst6 \
            libxkbcommon0 libwayland-client0 libdbus-1-3
      - name: Build solution & run full CoreCLR test suite (lavapipe Vulkan under Xvfb)
        run: |
          dotnet build BringEngine.sln -c Release
          xvfb-run -a dotnet ./tests/BringEngine.Tests/bin/Release/net10.0/BringEngine.Tests.dll
          dotnet publish src/ShowcaseGame/ShowcaseGame.csproj -c Release -r linux-x64
          EXE=./src/ShowcaseGame/bin/Release/net10.0/linux-x64/publish/ShowcaseGame
          "$EXE" --headless --ticks 600
          xvfb-run -a "$EXE" --verify-render --out build/verify-release-linux

  test-macos:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution & run CoreCLR headless tests
        run: |
          dotnet build BringEngine.sln -c Release
          dotnet ./tests/BringEngine.Tests/bin/Release/net10.0/BringEngine.Tests.dll --headless-only
          dotnet publish src/ShowcaseGame/ShowcaseGame.csproj -c Release -r osx-arm64
          ./src/ShowcaseGame/bin/Release/net10.0/osx-arm64/publish/ShowcaseGame --headless --ticks 600

  package-and-verify-sdk:
    needs: [detect-changes, test-windows, test-linux, test-macos]
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    env:
      SDK_NAME: bring-sdk-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Assemble cross-platform Bring Engine SDK archive
        shell: pwsh
        run: |
          $root = "dist/$env:SDK_NAME"
          New-Item -ItemType Directory -Force "$root/docs" | Out-Null
          New-Item -ItemType Directory -Force "$root/src" | Out-Null
          Copy-Item AGENTS.md, README.md, LICENSE, Directory.Build.props "$root/"
          Copy-Item -Recurse docs/agents "$root/docs/agents"

          function Copy-CleanTree($src, $dst) {
            Get-ChildItem -Path $src -Recurse -File | Where-Object {
              $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
            } | ForEach-Object {
              $rel = $_.FullName.Substring((Resolve-Path $src).Path.Length + 1)
              $out = Join-Path $dst $rel
              New-Item -ItemType Directory -Force (Split-Path $out) | Out-Null
              Copy-Item $_.FullName $out
            }
          }

          Copy-CleanTree src/BringEngine "$root/src/BringEngine"
          Copy-CleanTree src/ShowcaseGame "$root/src/ShowcaseGame"
          Copy-CleanTree tools/BringPacker "$root/tools/BringPacker"
          Copy-CleanTree tools/BringRig2D "$root/tools/BringRig2D"

          Compress-Archive -Path $root -DestinationPath "dist/$env:SDK_NAME.zip" -Force
          Get-Item "dist/$env:SDK_NAME.zip"
      - name: Verify standalone CoreCLR game, BringPacker & BringRig2D build against extracted SDK archive
        shell: pwsh
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "sdk-verify"
          if (Test-Path $verifyDir) { Remove-Item -Recurse -Force $verifyDir }
          Expand-Archive -Path "dist/$env:SDK_NAME.zip" -DestinationPath $verifyDir -Force
          $sdkDir = Join-Path $verifyDir $env:SDK_NAME
          dotnet publish "$sdkDir/tools/BringPacker/BringPacker.csproj" -c Release -r win-x64 -o "$verifyDir/packer"
          & "$verifyDir/packer/BringPacker.exe" --help
          dotnet publish "$sdkDir/tools/BringRig2D/BringRig2D.csproj" -c Release -r win-x64 -o "$verifyDir/rig2d"
          & "$verifyDir/rig2d/BringRig2D.exe" --help
          dotnet publish "$sdkDir/src/ShowcaseGame/ShowcaseGame.csproj" -c Release -r win-x64 -o "$verifyDir/out"
          & "$verifyDir/out/ShowcaseGame.exe" --headless --ticks 600
      - uses: actions/upload-artifact@v4
        with:
          name: bring-sdk
          path: dist/*.zip

  package-sdk-docs-only:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    env:
      SDK_NAME: bring-sdk-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Bring Engine SDK archive (docs-only, tests skipped)
        run: |
          set -euo pipefail
          ROOT="dist/${SDK_NAME}"
          rm -rf dist
          mkdir -p "${ROOT}/docs" "${ROOT}/src" "${ROOT}/tools"
          cp AGENTS.md README.md LICENSE Directory.Build.props "${ROOT}/"
          cp -R docs/agents "${ROOT}/docs/agents"
          rsync -a --exclude='bin/' --exclude='obj/' src/BringEngine/ "${ROOT}/src/BringEngine/"
          rsync -a --exclude='bin/' --exclude='obj/' src/ShowcaseGame/ "${ROOT}/src/ShowcaseGame/"
          rsync -a --exclude='bin/' --exclude='obj/' tools/BringPacker/ "${ROOT}/tools/BringPacker/"
          rsync -a --exclude='bin/' --exclude='obj/' tools/BringRig2D/ "${ROOT}/tools/BringRig2D/"
          (cd dist && zip -qr "${SDK_NAME}.zip" "${SDK_NAME}")
          unzip -l "dist/${SDK_NAME}.zip" | grep -q "${SDK_NAME}/AGENTS.md"
          unzip -l "dist/${SDK_NAME}.zip" | grep -q "${SDK_NAME}/src/BringEngine/BringEngine.csproj"
          ls -lh "dist/${SDK_NAME}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bring-sdk
          path: dist/*.zip

  publish:
    if: always() && !cancelled() && github.ref_type == 'tag' && (needs.package-and-verify-sdk.result == 'success' || needs.package-sdk-docs-only.result == 'success')
    needs: [detect-changes, package-and-verify-sdk, package-sdk-docs-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bring-sdk
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs_only }}
          PREV_TAG: ${{ needs.detect-changes.outputs.prev_tag }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "$DOCS_ONLY" = "true" ] && [ -n "$PREV_TAG" ]; then
            EXTRA_ARGS+=(--notes "Documentation-only release (no code changes since ${PREV_TAG}; test suite skipped)." --notes-start-tag "${PREV_TAG}")
          fi

          for attempt in 1 2 3 4; do
            echo "Publishing release ${{ github.ref_name }} (attempt $attempt)..."
            if gh release create "${{ github.ref_name }}" dist/*.zip \
              --repo "${{ github.repository }}" \
              --title "Bring Engine ${{ github.ref_name }}" \
              "${EXTRA_ARGS[@]}" \
              --generate-notes; then
              exit 0
            fi
            sleep 10
          done
          exit 1
