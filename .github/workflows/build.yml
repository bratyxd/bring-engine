name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution (Desktop CoreCLR Release)
        run: dotnet build BringEngine.sln -c Release
      - name: Run Engine Tests (WARP D3D12 + Headless)
        shell: pwsh
        run: |
          dotnet ./tests/BringEngine.Tests/bin/Release/net10.0/BringEngine.Tests.dll
          dotnet ./tests/BringEngine.Tests/bin/Release/net10.0/BringEngine.Tests.dll --headless-only
      - name: Publish & smoke-test BringPacker (Self-Contained ReadyToRun)
        shell: pwsh
        run: |
          dotnet publish tools/BringPacker/BringPacker.csproj -c Release -r win-x64
          ./tools/BringPacker/bin/Release/net10.0/win-x64/publish/BringPacker.exe --help
      - name: Publish & verify ShowcaseGame (Self-Contained ReadyToRun + Headless + Render)
        shell: pwsh
        run: |
          dotnet publish src/ShowcaseGame/ShowcaseGame.csproj -c Release -r win-x64
          $exe = "./src/ShowcaseGame/bin/Release/net10.0/win-x64/publish/ShowcaseGame.exe"
          & $exe --headless --ticks 600
          & $exe --verify-render --out build/verify-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-windows-x64
          path: |
            build/verify-windows/*.png
            tests/BringEngine.Tests/bin/Release/net10.0/verify_engine_test.png
            tests/BringEngine.Tests/bin/Release/net10.0/verify_nineslice_bc3_test.png
          if-no-files-found: ignore

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install SDL3 runtime, fonts & software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 \
            fonts-dejavu-core libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxss1 libxtst6 \
            libxkbcommon0 libwayland-client0 libdbus-1-3
      - name: Build solution (Desktop CoreCLR Release)
        run: dotnet build BringEngine.sln -c Release
      - name: Run Engine Tests (lavapipe Vulkan under Xvfb + Headless)
        run: |
          xvfb-run -a dotnet ./tests/BringEngine.Tests/bin/Release/net10.0/BringEngine.Tests.dll
          dotnet ./tests/BringEngine.Tests/bin/Release/net10.0/BringEngine.Tests.dll --headless-only
      - name: Publish & smoke-test BringPacker (Self-Contained ReadyToRun)
        run: |
          dotnet publish tools/BringPacker/BringPacker.csproj -c Release -r linux-x64
          ./tools/BringPacker/bin/Release/net10.0/linux-x64/publish/BringPacker --help
      - name: Publish & verify ShowcaseGame (Self-Contained ReadyToRun + Headless + Render)
        run: |
          dotnet publish src/ShowcaseGame/ShowcaseGame.csproj -c Release -r linux-x64
          EXE=./src/ShowcaseGame/bin/Release/net10.0/linux-x64/publish/ShowcaseGame
          "$EXE" --headless --ticks 600
          xvfb-run -a "$EXE" --verify-render --out build/verify-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-linux-x64
          path: |
            build/verify-linux/*.png
            tests/BringEngine.Tests/bin/Release/net10.0/verify_engine_test.png
            tests/BringEngine.Tests/bin/Release/net10.0/verify_nineslice_bc3_test.png
          if-no-files-found: ignore

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution (Desktop CoreCLR Release)
        run: dotnet build BringEngine.sln -c Release
      - name: Run Engine Tests (Headless)
        run: dotnet ./tests/BringEngine.Tests/bin/Release/net10.0/BringEngine.Tests.dll --headless-only
      - name: Publish & smoke-test BringPacker (Self-Contained ReadyToRun)
        run: |
          dotnet publish tools/BringPacker/BringPacker.csproj -c Release -r osx-arm64
          ./tools/BringPacker/bin/Release/net10.0/osx-arm64/publish/BringPacker --help
      - name: Publish & verify ShowcaseGame (Self-Contained ReadyToRun Headless)
        run: |
          dotnet publish src/ShowcaseGame/ShowcaseGame.csproj -c Release -r osx-arm64
          ./src/ShowcaseGame/bin/Release/net10.0/osx-arm64/publish/ShowcaseGame --headless --ticks 600
